<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:" />
		<title>Suonetar</title>
	</head>
	<body>
		<header id="top">
			<span id="where"></span>
			<span id="drafts"></span>
			<button id="undo" type="button" hidden></button>
			<button id="apply" type="button" class="primary">Apply</button>
			<button id="cancel" type="button" hidden>Cancel</button>
			<span id="status"></span>
			<span id="layout" class="segmented" title="How a commit shows its changed files; the draft and uncommitted views are always inline">
				<label><input type="radio" name="layout" value="inline" />Inline</label>
				<label><input type="radio" name="layout" value="three" />Three panes</label>
			</span>
		</header>
		<div id="body">
			<aside id="side">
				<div id="stack"></div>
				<div id="files"></div>
			</aside>
			<main id="doc"></main>
		</div>
		<script type="module" src="./main.ts"></script>
	</body>
</html>
